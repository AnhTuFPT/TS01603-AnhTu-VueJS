<!DOCTYPE html>
<html lang="vi">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <script src="js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet"

</head>
<body>

<!--  NAVBAR  -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">

        <a class="navbar-brand" href="#">
            <img src="images/logo-energy-pilates.png" alt="Logo" style="height: 40px;">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="fa-solid fa-list"></i> Bài viết
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="fa-solid fa-film"></i> Video
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="fa-solid fa-circle-info"></i> Giới thiệu
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="fa-solid fa-calendar-days"></i> Sự kiện
                    </a>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button"
                       data-bs-toggle="dropdown">
                        <i class="fa-solid fa-user"></i> Tài khoản
                    </a>
                    <ul class="dropdown-menu">
                        <li>
                            <a class="dropdown-item" href="#">
                                <i class="fa-solid fa-right-to-bracket"></i> Đăng nhập
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="#">
                                <i class="fa-solid fa-key"></i> Quên mật khẩu
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="#">
                                <i class="fa-solid fa-user-plus"></i> Đăng ký thành viên
                            </a>
                        </li>
                    </ul>
                </li>

            </ul>

            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="#">Tiếng Việt</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Tiếng Anh</a></li>
            </ul>

        </div>
    </div>
</nav>

<!-- CAROUSEL -->
<div class="container mt-4">

    <div id="CarLab3" class="carousel banner" data-bs-ride="carousel"> 
        <!-- Dòng này bắt buộc mấy dòng dưới phải trùng tên mới chạy đc (CarLab3) -->

        <!-- ... -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#CarLab3" data-bs-slide-to="0"
                    class="active"></button>
            <button type="button" data-bs-target="#CarLab3" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#CarLab3" data-bs-slide-to="2"></button>
        </div>

        <!-- Banner -->
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="images/banner1.jpg" class="d-block w-100" alt="Banner 1">
            </div>
            <div class="carousel-item">
                <img src="images/banner2.jpg" class="d-block w-100" alt="Banner 2">
            </div>
            <div class="carousel-item">
                <img src="images/banner3.jpg" class="d-block w-100" alt="Banner 3">
            </div>
        </div>

        <!-- Mũi tên -->
        <button class="carousel-control-prev" type="button"
                data-bs-target="#CarLab3" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button"
                data-bs-target="#CarLab3" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>
