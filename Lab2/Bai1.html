<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 1 - Bảng Thành Phần Dinh Dưỡng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <h3 class="text-center text-danger fw-bold mb-3">
        Bảng Thành Phần Dinh Dưỡng
    </h3>

    <table class="table table-bordered table-sm align-middle w-50 mx-auto">
    <tr class="text-center fw-bold">
        <th rowspan="2" style="background-color:#ffc107;">Thành Phần</th>
        <th colspan="2" style="background-color:#ffc107;">Giá Trị</th>
    </tr>
    <tr class="text-center fw-bold">
        <th style="background-color:#ffc107;">Khối Lượng</th>
        <th style="background-color:#ffc107;">% DV*</th>
    </tr>

    <tr>
        <td>Calories</td>
        <td>200 kcal</td>
        <td>20%</td>
    </tr>
    <tr>
        <td>Chất Béo</td>
        <td>9 g</td>
        <td>14%</td>
    </tr>
    <tr>
        <td>Chất Béo Bão Hòa</td>
        <td>4 g</td>
        <td>20%</td>
    </tr>
    <tr>
        <td>Chất Đạm</td>
        <td>8 g</td>
        <td>16%</td>
    </tr>
    <tr>
        <td>Chất Xơ</td>
        <td>5 g</td>
        <td>20%</td>
    </tr>
    <tr>
        <td>Đường</td>
        <td>12 g</td>
        <td>-</td>
    </tr>
    <tr>
        <td rowspan="2">Vitamin</td>
        <td>Vitamin C</td>
        <td>25%</td>
    </tr>
    <tr>
        <td>Vitamin D</td>
        <td>10%</td>
    </tr>
</table>
