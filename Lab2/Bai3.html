<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-4">
    <div class="mx-auto" style="max-width: 900px;">
        <ul class="nav nav-tabs">
            <li class="nav-item">
                <a class="nav-link active" data-bs-toggle="tab" href="#register">
                    Đăng ký
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#login">
                    Đăng nhập
                </a>
            </li>
        </ul>
        <div class="tab-content border border-top-0 p-4">

            <!-- ================= ĐĂNG KÝ ================= -->
            <div class="tab-pane fade show active" id="register">
                <div class="mx-auto" style="max-width: 800px;">
                    <h5 class="fw-bold mb-3">Form Đăng Ký Thông Tin</h5>

                    <div class="border rounded p-3">
                        <div class="mb-2">
                            <label class="form-label">Họ và Tên</label>
                            <input type="text" class="form-control" placeholder="Nhập họ và tên">
                        </div>

                        <div class="mb-2">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" placeholder="Nhập email">
                        </div>

                        <div class="mb-2">
                            <label class="form-label">Số Điện Thoại</label>
                            <input type="text" class="form-control" placeholder="Nhập số điện thoại">
                        </div>

                        <div class="mb-2">
                            <label class="form-label">Mật Khẩu</label>
                            <input type="password" class="form-control" placeholder="Nhập mật khẩu">
                        </div>

                        <div class="mb-2">
                            <label class="form-label">Xác Nhận Mật Khẩu</label>
                            <input type="password" class="form-control" placeholder="Xác nhận mật khẩu">
                        </div>

                        <div class="mb-2">
                            <label class="form-label">Giới Tính</label><br>
                            <input type="radio" name="gt"> Nam
                            <input type="radio" name="gt" class="ms-3"> Nữ
                        </div>

                        <div class="mb-2">
                            <label class="form-label">Ngôn Ngữ</label>
                            <select class="form-select">
                                <option>Tiếng Việt</option>
                                <option>English</option>
                            </select>
                        </div>

                        <div class="form-check mb-3">
                            <input type="checkbox" class="form-check-input">
                            <label class="form-check-label">
                                Tôi đồng ý với các điều khoản và điều kiện
                            </label>
                        </div>

                        <button class="btn btn-primary">Đăng Ký</button>
                    </div>
                </div>
            </div>

            <!-- ================= ĐĂNG NHẬP ================= -->
            <div class="tab-pane fade" id="login">
                <div class="mx-auto" style="max-width: px;">
                    <h5 class="fw-bold mb-3">Form Đăng nhập</h5>

                    <div class="border rounded p-3">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" placeholder="Nhập email">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mật Khẩu</label>
                            <input type="password" class="form-control" placeholder="Nhập mật khẩu">
                        </div>

                        <button class="btn btn-primary">Đăng Nhập</button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
