<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Button</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-5">
    <h1>37_Lê Nguyễn Anh Tú</h1>

    <div class="btn-group mt-3" role="group">

        <div class="btn-group" role="group">
            <button type="button"
                    class="btn btn-primary dropdown-toggle"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">
                Apple
            </button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">iPhone 16 Pro</a></li>
                <li><a class="dropdown-item" href="#">iPhone 15</a></li>
            </ul>
        </div>

        <div class="btn-group" role="group">
            <button type="button"
                    class="btn btn-success dropdown-toggle"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">
                Samsung
            </button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Galaxy A36</a></li>
                <li><a class="dropdown-item" href="#">Galaxy A10</a></li>
            </ul>
        </div>

        <div class="btn-group" role="group">
            <button type="button"
                    class="btn btn-warning dropdown-toggle"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">
                Sony
            </button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Xperia 1</a></li>
                <li><a class="dropdown-item" href="#">Xperia 5</a></li>
            </ul>
        </div>
    </div>
</div>

<p></p>



</body>
</html>
